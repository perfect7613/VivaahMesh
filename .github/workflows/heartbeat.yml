# Wakes the always-on VivaahMesh agent. Quiet weddings are skipped without a model call.
name: agent-heartbeat
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Heartbeat
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          curl -fsS -X POST https://vivaahmesh.vercel.app/api/agent/heartbeat \
            -H "x-ops-secret: $OPS_SECRET" --max-time 300
