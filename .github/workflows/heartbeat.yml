# Wakes the always-on VivaahMesh agent. Quiet weddings are skipped without a model call.
name: agent-heartbeat
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            header="Authorization: Bearer $CRON_SECRET"
          else
            : "${OPS_SECRET:?Configure the heartbeat credential}"
            header="x-ops-secret: $OPS_SECRET"
          fi
          curl -fsS --output /dev/null -X POST https://vivaahmesh.vercel.app/api/agent/heartbeat \
            -H "$header" --max-time 300
